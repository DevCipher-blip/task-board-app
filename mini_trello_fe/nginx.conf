worker_processes auto;
pid /tmp/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  access_log /dev/stdout;
  error_log /dev/stderr warn;
  sendfile on;
  server_tokens off;

  # Writable paths for an unprivileged worker.
  client_body_temp_path /tmp/client_body;
  proxy_temp_path /tmp/proxy;
  fastcgi_temp_path /tmp/fastcgi;
  uwsgi_temp_path /tmp/uwsgi;
  scgi_temp_path /tmp/scgi;

  # Docker's DNS. Resolving per request (via the variable below) keeps
  # /graphql working after the API container restarts with a new address.
  resolver 127.0.0.11 valid=10s ipv6=off;

  server {
    listen 3000;
    root /usr/share/nginx/html;

    location /graphql {
      set $api_upstream http://backend:8001;
      proxy_pass $api_upstream;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /assets/ {
      add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
      try_files $uri /index.html;
    }
  }
}
